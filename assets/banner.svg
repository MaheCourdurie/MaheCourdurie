<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Mahé Courdurié — étudiant à Epitech">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1A0C"/><stop offset="0.55" stop-color="#5C3A1F"/><stop offset="1" stop-color="#65793C"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#F5EBE0" opacity="0.13"/></pattern>
    <clipPath id="round"><rect width="1200" height="280" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #D9B98F; }
    .name { font: 800 62px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #F5EBE0; letter-spacing: -1px; }
    .line { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #CFE0A5; }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <circle cx="1030" cy="70" r="170" fill="#A0673A" opacity="0.22"/>
    <circle cx="1120" cy="250" r="130" fill="#65793C" opacity="0.35"/>
    <circle cx="880" cy="290" r="90" fill="#F5EBE0" opacity="0.07"/>
    <g opacity="0.9" transform="translate(940 62)">
      <rect width="190" height="120" rx="12" fill="#1B1107" opacity="0.75"/>
      <circle cx="16" cy="16" r="5" fill="#E0644F"/><circle cx="33" cy="16" r="5" fill="#E8B64C"/><circle cx="50" cy="16" r="5" fill="#7DB35C"/>
      <rect x="16" y="40" width="96" height="8" rx="4" fill="#A0673A"/>
      <rect x="16" y="58" width="140" height="8" rx="4" fill="#65793C"/>
      <rect x="16" y="76" width="70" height="8" rx="4" fill="#D9B98F"/>
      <rect x="16" y="94" width="118" height="8" rx="4" fill="#65793C" opacity="0.6"/>
    </g>
  </g>
  <text x="64" y="86" class="mono">~/mahe $ whoami</text>
  <text x="64" y="160" class="name">Mahé Courdurié</text>
  <text x="64" y="196" class="line" opacity="0">Web · du design à la mise en ligne
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.26;1" dur="12s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="64" y="196" class="line" opacity="0">IA locale · modèles et assistants
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.26;1" dur="12s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="64" y="196" class="line" opacity="0">iOS · SwiftUI
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.26;1" dur="12s" begin="6s" repeatCount="indefinite"/>
  </text>
  <text x="64" y="196" class="line" opacity="0">Jeux · Java et libGDX
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.26;1" dur="12s" begin="9s" repeatCount="indefinite"/>
  </text>
  <rect x="64" y="222" width="14" height="26" fill="#F5EBE0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
